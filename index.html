<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>家計簿ミニアプリ</title>
</head>

<!--
  以下のブロックは HTMLのBody部分です。家計簿ミニアプリのHTMLファイルです。
  一度、ブラウザで表示してみてください。

  【タスク1】 LPで学んだ知識をもとに、デザインなど編集してみてください。

  -->
<body>
  <h1>クラス5 家計簿ミニアプリ</h1>

  <div>
    <label>ユーザー名:</label>
    <input id="user" type="text" required />
  </div>

  <br />

  <div>
    <label>アイテム名:</label>
    <input id="item" type="text" />
  </div>

  <div>
    <label>金額:</label>
    <input id="price" type="number" required />
  </div>

  <!--
    「送信」: 入力した user/item/price を FastAPI に送って、CSVに保存してもらう
    「分析」: user を送って、合計金額を計算してもらう
  -->
  <button id="sendBtn">送信</button>  <br />
  <br />
  <button id="analyzeBtn">分析</button>


  <!-- 
    APIの結果（メッセージ）を表示する場所
    何も入っていないように見えますが、JavaScriptでFAST APIから取ってきた文字が書き加えられます。
  -->
  <div>
    <h3>結果</h3>
    <div id="result"></div>
  </div>



<!--
  以下のブロックは Javascriptです。
  上のHTML Bodyで'id'を指定した指示した部分の値を読み取ったり、文字を埋め込んだりできます。
  大まかに何をしているかつかめれば、細かい部分は気にしなくても大丈夫です。
  分析結果を受け取る部分が未完成なので、タスク2の部分を修正してください。
-->

  <script>
    // ---------------------------
    // 1) HTML要素を取得する
    // ---------------------------
    // データを送受信できるように、画面に入力された・出力する値を変数にしています。
    const userData = document.getElementById("user");
    const itemData = document.getElementById("item");
    const priceData = document.getElementById("price");
    const resultData = document.getElementById("result");

    // ---------------------------
    // 2) 「送信」ボタンの処理
    // ---------------------------
    // addEventListener("click", ...) でボタンが押されたときの処理を登録します。
    document.getElementById("sendBtn").addEventListener("click", async () => {
      // 入力値をJSONとしてまとめます（FastAPIへ送るデータ）
      // price は文字列ではなく数値として送りたいので Number(...) で変換します。
      const body = {
        user: userData.value,
        item: itemData.value,
        price: Number(priceData.value),
      };

      // fetch() で FastAPI にリクエストを送ります。
      // method: "POST" でPOST送信
      // headers: JSONを送るので Content-Type を application/json にします
      // body: JSON文字列にするため JSON.stringify を使います
      const res = await fetch("/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      // FastAPIから返ってくるJSON（例: {"message": "..."}）を読む
      const json_data = await res.json();

      // 画面に結果メッセージを表示
      resultData.textContent = json_data.message;
    });


    // ---------------------------
    // 3) 「分析」ボタンの処理
    // ---------------------------
    document.getElementById("analyzeBtn").addEventListener("click", async () => {

      //
      // 【タスク2】 変数resに、FAST APIから取得した分析結果を入れるよう修正してください。
      //            POSTではなく、GETで送ることに注意してね。
      //
      //       ヒント:  const res = await fetch(`ここにURLを指定してね`); 
      //

      // ユーザー名を取得
      user = userData.value

      // リクエストを送る
      const res = await fetch(`/analyze?user=${user}`, {
        method: "GET",
      });

      const analyzed_data = await res.json();
      // 画面に合計結果を表示
      resultData.textContent = analyzed_data.message;
    });
  </script>
</body>
</html>
