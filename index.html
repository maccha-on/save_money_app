<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>C5 Wallet</title>
</head>

<body>

<div class="container">

<div class="form-group">
    <label>ユーザー名</label>
    <input type="text" id= "user" placeholder="例：リジチョー">

<div class="form-group">
    <label>日付</label>
    <input type="date" id="entry-date" />
</div>

<div class="form-group">
    <label>アイテム名</label>
    <input type="text" id="item" placeholder="例：コーヒー">

    <label>金額</label>

<button id="historyBtn">履歴を見る</button>

<h2>AIコーチング分析</h2>

<input type="number" id="budget" placeholder="例：30000">
</div>

```
<div class="coach-buttons">
      <button id="analyze-oniBtn"> 👹鬼コーチ</button>
      <button id="analyze-tenshiBtn"> 👼天使コーチ</button>
    </div>


```

</div>

<!--
APIの結果（メッセージ）を表示する場所
何も入っていないように見えますが、JavaScriptでFAST APIから取ってきた文字が書き加えられます。
-->
<div class="result-card">
<div id="result" class="result-message">ここにアドバイスが表示されます
</div>
</div>

<script>
// ---------------------------
// 1) HTML要素を取得する
// ---------------------------
// データを送受信できるように、画面に入力された・出力する値を変数にしています。
const userData = document.getElementById("user");
const itemData = document.getElementById("item");
const priceData = document.getElementById("price");
const resultData = document.getElementById("result");
const budgetData = document.getElementById("budget");
const entryDateData = document.getElementById("entry-date");


// ---------------------------
// 2) 「送信」ボタンの処理
// ---------------------------
// addEventListener("click", ...) でボタンが押されたときの処理を登録します。
document.getElementById("sendBtn").addEventListener("click", async () => {
  // 入力値をJSONとしてまとめます（FastAPIへ送るデータ）
  // price は文字列ではなく数値として送りたいので Number(...) で変換します。
  const body = {
    user: userData.value.trim(),
    item: itemData.value.trim(),
    price: Number(priceData.value),
    entryDate: entryDateData.value
  };

  if (body.user === '' || body.item === '' || body.price === 0 || entryDateData.value === '') {
    alert('入力項目が不足しています');
    return false;
  }

  // fetch() で FastAPI にリクエストを送ります。
  // method: "POST" でPOST送信
  // headers: JSONを送るので Content-Type を application/json にします
  // body: JSON文字列にするため JSON.stringify を使います
  const res = await fetch("/add", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });

  // FastAPIから返ってくるJSON（例: {"message": "..."}）を読む
  const json_data = await res.json();

  resultData.textContent = json_data.message;
});

// ---------------------------
// 3) 「鬼コーチ」ボタンの処理
// ---------------------------
document.getElementById("analyze-oniBtn").addEventListener("click", async () => {

  // ユーザー名を取得
  user = userData.value.trim();
  budget = Number(budgetData.value);
  if (user === '' || budget === 0) {
    alert('入力項目が不足しています');
    return false;
  }

  // リクエストを送る
  const res = await fetch(`/analyze?user=${user}&coach=oni&budget=${budget}`, {
    method: "GET",
  });

  const analyzed_data = await res.json();
  // 画面に合計結果を表示
  resultData.innerText = analyzed_data.message;
});

// ---------------------------
// 3) 「天使コーチ」ボタンの処理
// ---------------------------
document.getElementById("analyze-tenshiBtn").addEventListener("click", async () => {

  // ユーザー名を取得
  user = userData.value;
  budget = Number(budgetData.value);
  if (user === '' || budget === 0) {
    alert('入力項目が不足しています');
    return false;
  }

  // リクエストを送る
  const res = await fetch(`/analyze?user=${user}&coach=tenshi&budget=${budget}`, {
    method: "GET",
  });

  const analyzed_data = await res.json();
  // 画面に合計結果を表示
  resultData.textContent = analyzed_data.message;
});

// ---------------------------
// 3) 「履歴を見る」ボタンの処理
// ---------------------------
document.getElementById("historyBtn").addEventListener("click", async () => {
  user = userData.value.trim();

  if (user === '') {
    alert('ユーザー名を入力してください');
  }
  // リクエストを送る
  const res = await fetch(`/history?user=${user}`, {
    method: "GET",
  });

  const history_data = await res.json();
  // 画面に結果メッセージを表示
  const history_message = history_data.history.join("");
  resultData.innerText = "合計金額" + history_data.total_money + "\\n" + history_message;
})


</script>
</body>
</html>
